# ProGuard Configuration for Blackpassword v12.1

# 1. Entry Point
-keep public class com.mycompany.blackpassword.core.Blackpassword {
    public static void main(java.lang.String[]);
}

# 2. Keep project-specific classes (Internal logic stays, but obfuscated)
# We want to keep the names of these for debuggability or just leave them to be renamed.
# Actually, since we want security, we want them renamed.
# But we MUST keep things used by reflection (none currently known for our own code).

# 3. Third Party Libraries (Suppressing Optional/Platform-specific warnings)
-dontwarn java.lang.instrument.**
-dontwarn javax.annotation.**
-dontwarn org.apache.**
-dontwarn com.google.**
-dontwarn io.grpc.netty.shaded.**
-dontwarn io.opentelemetry.**
-dontwarn okhttp3.internal.platform.**
-dontwarn com.squareup.okhttp.**
-dontwarn org.osgi.**
-dontwarn aQute.bnd.**
-dontwarn org.jetbrains.annotations.**
-dontwarn java.lang.Thread$Builder**
-dontwarn android.security.**
-dontwarn android.net.**
-dontwarn android.os.**
-dontwarn android.util.**
-dontwarn org.bouncycastle.**
-dontwarn org.openjsse.**
-dontwarn sun.misc.Unsafe
-dontwarn org.osgi.annotation.bundle.Export
-dontwarn com.ctc.wstx.**
-dontwarn com.formdev.flatlaf.**
-dontwarn com.github.weisj.jsvg.**
-dontwarn io.grpc.xds.**
-ignorewarnings

# Firebase & gRPC (Must keep names for linkage/reflection)
-keep class com.google.** { *; }
-keep class io.grpc.** { *; }
-keep class com.google.firebase.** { *; }
-keep class com.google.cloud.** { *; }

# FlatLaf (UI properties and reflection)
-keep class com.formdev.flatlaf.** { *; }

# JAI ImageIO & PDFBox (Must keep for ImageIO services)
-keep class com.github.jaiimageio.** { *; }
-keep class org.apache.pdfbox.** { *; }
-keep class org.apache.fontbox.** { *; }

# SQLite (Native methods and reflection)
-keep class org.xerial.sqlite.** { *; }

# ZXing
-keep class com.google.zxing.** { *; }

# Adapt resource files (Updates META-INF/services contents)
-adaptresourcefilecontents META-INF/services/**
-adaptresourcefilenames **.properties,**.xml,**.json

# ProGuard attributes
-keepattributes Signature,SourceFile,LineNumberTable,*Annotation*
-dontnote
-dontoptimize
-dontshrink

# Keep attributes that are used by reflection
-keepclassmembers class * {
    @com.google.gson.annotations.SerializedName <fields>;
}

# Keep members of Enums
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
